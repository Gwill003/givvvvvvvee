<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donation</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
    overflow-x: hidden;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 15px;
    position: relative;
    overflow: hidden;
}

/* PAGE SYSTEM */
.page {
    position: absolute;
    width: 100%;
    top: 0;
    left: 0;
    opacity: 0;
    transform: translateX(100%);
    transition: all 0.5s ease;
}

.page.active {
    opacity: 1;
    transform: translateX(0);
    position: relative;
}

.page.exit {
    transform: translateX(-100%);
    opacity: 0;
}

/* CONTENT ANIMATION */
.fade-up {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.6s forwards;
}

.fade-up.delay {
    animation-delay: 0.2s;
}

@keyframes fadeUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* IMAGE */
.hero img {
    width: 100%;
    border-radius: 12px;
}

/* TEXT */
.text {
    margin-top: 15px;
    line-height: 1.5;
}

/* BUTTON */
.btn {
    display: block;
    width: 100%;
    background: #2f6fed;
    color: white;
    text-align: center;
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
    font-size: 18px;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.btn:active {
    transform: scale(0.96);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

/* DONATION PAGE */
.toggle {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.toggle button {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    background: #eee;
    border-radius: 6px;
}

.amounts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.amounts button {
    padding: 12px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.amounts button:hover {
    transform: scale(1.05);
}

.amounts button.active {
    border: 2px solid #2f6fed;
    background: #eef3ff;
}

/* INPUT */
input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}
</style>
</head>

<body>

<div class="container">

    <!-- PAGE 1 -->
    <div id="page1" class="page active">
        <h1 class="fade-up">Help Them Live</h1>

        <div class="hero fade-up delay">
            <img src="your-image.jpg">
        </div>

        <div class="text fade-up delay">
            <p><b>Gaza’s newborns are fighting to survive.</b></p>
            <p>No food. No safety. No homes.</p>
            <p><b>We need your help.</b></p>
        </div>

        <button class="btn fade-up delay" onclick="goToPage2()">Donate</button>
    </div>


    <!-- PAGE 2 -->
    <div id="page2" class="page">
        <h2 class="fade-up">Secure donation</h2>

        <div class="toggle fade-up delay">
            <button>Give once</button>
            <button>Monthly</button>
        </div>

        <div class="amounts fade-up delay">
            <button>€800</button>
            <button>€400</button>
            <button>€200</button>
            <button class="active">€85</button>
            <button>€40</button>
            <button>€20</button>
        </div>

        <input id="amountInput" type="text" value="€85" class="fade-up delay">

        <a href="https://your-link-here.com" class="btn fade-up delay">Donate</a>
    </div>

</div>

<script>
function goToPage2() {
    const p1 = document.getElementById("page1");
    const p2 = document.getElementById("page2");

    p1.classList.add("exit");

    setTimeout(() => {
        p1.classList.remove("active", "exit");
        p2.classList.add("active");
    }, 300);
}

/* Amount selection logic */
const buttons = document.querySelectorAll(".amounts button");
const input = document.getElementById("amountInput");

buttons.forEach(btn => {
    btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        input.value = btn.innerText;
    });
});
</script>

</body>
</html>
