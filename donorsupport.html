<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donation</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 15px;
}

/* Hide pages */
.page {
    display: none;
}

.page.active {
    display: block;
}

h1, h2 {
    margin: 10px 0;
}

.hero img {
    width: 100%;
    border-radius: 10px;
}

.text {
    margin-top: 15px;
    line-height: 1.5;
}

.btn {
    display: block;
    width: 100%;
    background: #2f6fed;
    color: white;
    text-align: center;
    padding: 15px;
    border-radius: 8px;
    margin-top: 20px;
    font-size: 18px;
    border: none;
    cursor: pointer;
}

/* Donation page styles */
.toggle {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.toggle button {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    background: #eee;
    border-radius: 6px;
}

.amounts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.amounts button {
    padding: 12px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 6px;
    cursor: pointer;
}

.amounts button.active {
    border: 2px solid #2f6fed;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}
</style>
</head>

<body>

<div class="container">

    <!-- PAGE 1 -->
    <div id="page1" class="page active">
        <h1>Help Them Live</h1>

        <!-- IMAGE PLACEHOLDER -->
        <div class="hero">
            <img src="your-image.jpg">
        </div>

        <div class="text">
            <p><b>Gaza’s newborns are fighting to survive.</b></p>
            <p>No food. No safety. No homes.</p>
            <p><b>We need your help.</b></p>
        </div>

        <button class="btn" onclick="goToPage2()">Donate</button>
    </div>


    <!-- PAGE 2 -->
    <div id="page2" class="page">
        <h2>Secure donation</h2>

        <div class="toggle">
            <button>Give once</button>
            <button>Monthly</button>
        </div>

        <div class="amounts">
            <button>€800</button>
            <button>€400</button>
            <button>€200</button>
            <button class="active">€85</button>
            <button>€40</button>
            <button>€20</button>
        </div>

        <input type="text" value="€85">

        <!-- FINAL LINK -->
        <a href="https://your-link-here.com" class="btn">Donate</a>
    </div>

</div>

<script>
function goToPage2() {
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");
}
</script>

</body>
</html>
