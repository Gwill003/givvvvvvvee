<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donation</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    background: #f2f2f2;
}

/* CONTAINER */
.container {
    max-width: 420px;
    margin: auto;
    background: #fff;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
}

/* PAGE SYSTEM */
.page {
    position: absolute;
    width: 100%;
    top: 0;
    left: 0;
    background: #fff;
    transition: transform 0.35s ease;
}

.page.hidden {
    transform: translateX(100%);
}

.header {
    padding: 15px;
    text-align: center;
}

.header h1 {
    font-size: 22px;
    margin: 10px 0;
}

/* HERO IMAGE */
.hero img {
    width: 100%;
}

/* TEXT */
.content {
    padding: 15px;
    font-size: 15px;
    line-height: 1.5;
}

/* DONATE BAR (FIXED LIKE REAL SITE) */
.bottom-bar {
    position: fixed;
    bottom: 0;
    width: 100%;
    max-width: 420px;
    background: #fff;
    padding: 10px;
    border-top: 1px solid #ddd;
}

.btn {
    width: 100%;
    padding: 15px;
    background: #2f6fed;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

/* PAGE 2 */
.section {
    padding: 15px;
}

.toggle {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.toggle div {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.toggle .active {
    border: 2px solid #2f6fed;
}

/* AMOUNTS GRID */
.amounts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.amount {
    padding: 14px;
    text-align: center;
    border-radius: 10px;
    border: 1px solid #ccc;
    background: #fff;
}

.amount.active {
    border: 2px solid #2f6fed;
}

/* INPUT */
.input-box {
    margin-top: 10px;
}

.input-box input {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="container">

    <!-- PAGE 1 -->
    <div id="page1" class="page">
        <div class="header">
            <h1>Help Them Live - Save Babies</h1>
        </div>

        <div class="hero">
            <!-- REPLACE IMAGE -->
            <img src="your-image.jpg">
        </div>

        <div class="content">
            <p><b>Gaza’s newborns are fighting to survive.</b></p>
            <p>No homes. No milk. No safety.</p>
            <p><b>We cannot do this without you.</b></p>
        </div>
    </div>

    <!-- PAGE 2 -->
    <div id="page2" class="page hidden">

        <div class="section">
            <h2>Secure donation</h2>

            <div class="toggle">
                <div class="active">Give once</div>
                <div>Monthly</div>
            </div>

            <div class="amounts">
                <div class="amount">€800</div>
                <div class="amount">€400</div>
                <div class="amount">€200</div>
                <div class="amount active">€85</div>
                <div class="amount">€40</div>
                <div class="amount">€20</div>
            </div>

            <div class="input-box">
                <input type="text" value="€85">
            </div>
        </div>

    </div>

</div>

<!-- FIXED BUTTON -->
<div class="bottom-bar">
    <button id="mainBtn" class="btn">Donate</button>
</div>

<script>
let step = 1;

document.getElementById("mainBtn").onclick = () => {
    if (step === 1) {
        document.getElementById("page2").classList.remove("hidden");
        step = 2;
    } else {
        window.location.href = "https://your-link-here.com";
    }
};

/* amount selection */
document.querySelectorAll(".amount").forEach(el => {
    el.onclick = () => {
        document.querySelectorAll(".amount").forEach(a => a.classList.remove("active"));
        el.classList.add("active");
        document.querySelector("input").value = el.innerText;
    };
});
</script>

</body>
</html>
