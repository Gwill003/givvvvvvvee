<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Secure donation · Gaza newborns</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5f2ef;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 16px;
      color: #1e2b36;
    }

    .card {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border-radius: 36px;
      box-shadow: 0 16px 35px -8px rgba(0, 0, 0, 0.08), 0 8px 12px -4px rgba(0, 0, 0, 0.03);
      padding: 28px 24px 32px;
      border: 1px solid #f0e3d9;
      transition: all 0.2s;
    }

    /* header / back */
    .top-bar {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      color: #5b6f7e;
      font-weight: 500;
      font-size: 1rem;
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: color 0.1s;
    }

    .back-link i {
      font-size: 1rem;
    }

    .back-link:hover {
      color: #1e3f51;
    }

    .url-hint {
      margin-left: auto;
      font-size: 0.8rem;
      color: #a29286;
      letter-spacing: 0.2px;
      background: #f7f2ee;
      padding: 6px 12px;
      border-radius: 40px;
    }

    h2 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      color: #0f293b;
    }

    /* tabs */
    .tab-row {
      display: flex;
      gap: 24px;
      border-bottom: 2px solid #e7dbd1;
      margin-bottom: 28px;
    }

    .tab {
      font-size: 1.2rem;
      font-weight: 600;
      padding-bottom: 12px;
      color: #7e909e;
      border-bottom: 3px solid transparent;
      cursor: default;
    }

    .tab.active {
      color: #1e4a5f;
      border-bottom: 3px solid #b2221c;
    }

    /* amount grid */
    .amount-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .amount-btn {
      background: white;
      border: 1.8px solid #e3d6cc;
      border-radius: 60px;
      padding: 16px 4px;
      font-weight: 700;
      font-size: 1.3rem;
      color: #1a3e4f;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.02);
      text-decoration: none;
      display: block;
    }

    .amount-btn:hover {
      background: #f6f0eb;
      border-color: #b68b6b;
      transform: scale(0.98);
    }

    .amount-btn.highlight {
      background: #1e4a5f;
      border-color: #1e4a5f;
      color: white;
    }

    /* custom amount row */
    .custom-row {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1.8px solid #e3d6cc;
      border-radius: 60px;
      padding: 6px 18px 6px 22px;
      margin: 8px 0 24px;
    }

    .euro-sign {
      font-weight: 700;
      font-size: 1.8rem;
      color: #1a3e4f;
      margin-right: 6px;
    }

    .custom-row input {
      border: none;
      font-size: 1.8rem;
      font-weight: 600;
      width: 100%;
      outline: none;
      background: transparent;
      padding: 12px 0;
      color: #1a3e4f;
      font-family: inherit;
    }

    .currency-label {
      font-weight: 600;
      font-size: 1.3rem;
      color: #7b685a;
      margin-left: 6px;
    }

    /* dedicate row */
    .dedicate-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 18px 0 16px;
      font-size: 1.15rem;
      font-weight: 500;
      color: #1f3a47;
      cursor: pointer;
    }

    .dedicate-row input {
      width: 24px;
      height: 24px;
      accent-color: #b2221c;
      border-radius: 8px;
      cursor: pointer;
    }

    /* comment field */
    .comment-input {
      width: 100%;
      padding: 18px 18px;
      border-radius: 28px;
      border: 1.8px solid #e3d6cc;
      background: white;
      font-size: 1rem;
      margin: 8px 0 24px;
      resize: vertical;
      font-family: inherit;
    }

    .comment-input::placeholder {
      color: #9d8d80;
      font-weight: 400;
    }

    /* main donate button */
    .donate-main {
      background: #b2221c;
      color: white;
      border: none;
      width: 100%;
      padding: 20px 16px;
      font-size: 1.5rem;
      font-weight: 700;
      border-radius: 60px;
      margin-bottom: 28px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(178, 34, 28, 0.2);
      transition: 0.12s;
      border: 1px solid #951f19;
      text-align: center;
      display: block;
      text-decoration: none;
    }

    .donate-main i {
      margin-right: 10px;
    }

    .donate-main:hover {
      background: #9b1d17;
      box-shadow: 0 8px 14px rgba(178, 34, 28, 0.25);
    }

    /* footer links */
    .info-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      row-gap: 14px;
      font-size: 0.9rem;
      color: #4f6779;
      margin-top: 8px;
    }

    .info-links span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 4px 0;
    }

    .info-links i {
      color: #1e4a5f;
      width: 20px;
    }

    .divider-light {
      margin: 20px 0 10px;
      height: 1px;
      background: #e7dbd1;
    }

    .secure-badge {
      font-size: 0.75rem;
      color: #8a786a;
      display: flex;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>
<div class="card">
  
  <!-- top line: reg.kanex.online/donorsupport.h + back -->
  <div class="top-bar">
    <div class="back-link" onclick="window.history.length > 1 ? history.back() : alert('← Back to campaign')">
      <i class="fas fa-arrow-left"></i> Back
    </div>
    <div class="url-hint">
      <i class="fas fa-link" style="font-size: 0.7rem;"></i> reg.kanex.online/donorsupport.h
    </div>
  </div>

  <h2>Secure donation</h2>

  <!-- tabs: give once / monthly -->
  <div class="tab-row">
    <div class="tab active">Give once</div>
    <div class="tab">Monthly</div>
  </div>

  <!-- amount presets: each linked to different URL -->
  <div class="amount-grid">
    <a href="https://example.com/donate/800" class="amount-btn" target="_blank" rel="noopener">€800</a>
    <a href="https://example.com/donate/400" class="amount-btn" target="_blank" rel="noopener">€400</a>
    <a href="https://example.com/donate/200" class="amount-btn" target="_blank" rel="noopener">€200</a>
    <a href="https://example.com/donate/85" class="amount-btn highlight" target="_blank" rel="noopener">€85</a>
    <a href="https://example.com/donate/40" class="amount-btn" target="_blank" rel="noopener">€40</a>
    <a href="https://example.com/donate/20" class="amount-btn" target="_blank" rel="noopener">€20</a>
  </div>

  <!-- custom amount row (€85 prefilled, linked to its own URL) -->
  <div class="custom-row">
    <span class="euro-sign">€</span>
    <input type="number" value="85" min="1" step="1" id="customAmountInput" aria-label="Custom amount in Euros">
    <span class="currency-label">EUR</span>
  </div>

  <!-- dedicate checkbox -->
  <div class="dedicate-row" onclick="document.getElementById('dedicateCheck').click();">
    <input type="checkbox" id="dedicateCheck">
    <label for="dedicateCheck" style="cursor: pointer;">☐ Dedicate this donation</label>
  </div>

  <!-- comment field -->
  <textarea class="comment-input" placeholder="Add comment" rows="2"></textarea>

  <!-- MAIN DONATE BUTTON: directs to custom amount link -->
  <a href="#" class="donate-main" id="mainDonateButton" target="_blank" rel="noopener">
    <i class="fas fa-lock"></i> Donate
  </a>

  <!-- info links -->
  <div class="info-links">
    <span onclick="alert('🔐 All donations are processed with bank-level encryption.')"><i class="fas fa-shield-alt"></i> Is my donation secure?</span>
    <span onclick="alert('📄 Tax receipts are provided for eligible donations.')"><i class="fas fa-file-invoice"></i> Is this donation tax-deductible?</span>
    <span onclick="alert('🔄 You can manage or cancel recurring donations anytime.')"><i class="fas fa-sync-alt"></i> Can I cancel my recurring donation?</span>
    <span onclick="alert('🍪 We use essential cookies only.')"><i class="fas fa-cookie-bite"></i> Cookie policy</span>
  </div>

  <div class="divider-light"></div>
  <div class="secure-badge">
    <i class="fas fa-lock"></i> 256-bit SSL secure · reg.kanex.online
  </div>
</div>

<script>
  (function() {
    // EACH AMOUNT LINK is already distinct.
    // The main Donate button will dynamically link based on custom input value.
    const customInput = document.getElementById('customAmountInput');
    const mainDonateBtn = document.getElementById('mainDonateButton');
    const amountLinks = document.querySelectorAll('.amount-btn');
    
    // Function to update main button URL based on custom amount
    function updateMainDonateLink() {
      let val = customInput.value.trim();
      if (val === '' || isNaN(val) || Number(val) <= 0) {
        val = '85'; // fallback
        customInput.value = 85;
      }
      // Build link – each amount goes to different endpoint
      const base = 'https://example.com/donate/';
      const amount = Math.floor(Number(val));
      mainDonateBtn.href = base + amount;
      
      // remove highlight from all preset buttons if custom value doesn't match exactly
      const matchPreset = Array.from(amountLinks).some(link => {
        const presetVal = link.textContent.replace('€', '').trim();
        return presetVal === String(amount);
      });
      
      amountLinks.forEach(link => {
        link.classList.remove('highlight');
        const presetVal = link.textContent.replace('€', '').trim();
        if (presetVal === String(amount)) {
          link.classList.add('highlight');
        }
      });
    }
    
    // initial
    updateMainDonateLink();
    
    // listen to input changes
    customInput.addEventListener('input', updateMainDonateLink);
    
    // when clicking on a preset, we change the input and update link
    amountLinks.forEach(link => {
      link.addEventListener('click', function(e) {
        // we don't prevent default — but the link will open a new tab.
        // we also want the interface to reflect the amount.
        const amountText = this.textContent.replace('€', '').trim();
        const amountNum = parseInt(amountText, 10);
        if (!isNaN(amountNum)) {
          customInput.value = amountNum;
          updateMainDonateLink();
        }
        // remove highlight and add to clicked (but the link may navigate away)
        amountLinks.forEach(l => l.classList.remove('highlight'));
        this.classList.add('highlight');
        
        // optional: if you want to avoid opening the preset link (and only use main button)
        // you could prevent default and rely on main button. but the spec: "every amount be directed to a different link"
        // we keep the preset links functional (they open new tab). If you want the main button to be the only way, 
        // we can change behaviour. but it's fine.
        // However, to be safe, we let them open; but we also sync the main button.
      });
    });
    
    // Dedicate checkbox toggle text
    const dedicateCheck = document.getElementById('dedicateCheck');
    const dedicateLabel = document.querySelector('.dedicate-row label');
    
    function updateDedicateLabel() {
      if (dedicateCheck.checked) {
        dedicateLabel.innerHTML = '☒ Dedicate this donation';
      } else {
        dedicateLabel.innerHTML = '☐ Dedicate this donation';
      }
    }
    
    dedicateCheck.addEventListener('change', updateDedicateLabel);
    // initial: unchecked
    dedicateCheck.checked = false;
    updateDedicateLabel();
    
    // also clicking on label toggles (already handled via onclick on parent)
    // additional: make 'Monthly' tab non-interactive, just UI
    document.querySelectorAll('.tab')[1].addEventListener('click', function() {
      alert('✨ Monthly giving option will be available soon. Thank you for your compassion.');
    });
    
    // main donate button: opens the custom amount link
    // already set up.
  })();
</script>

<!-- note: the links go to example.com/donate/... replace with actual campaign URLs -->
</body>
</html>
```
